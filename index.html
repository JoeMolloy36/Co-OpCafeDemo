<!DOCTYPE html>
<html lang="en-us">
  <head>
    <link rel="apple-touch-icon" href="icon.png">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Co-Op Cafe Demo</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Co-Op Cafe Demo</div>
      </div>
    </div>

<script>
  var container = document.querySelector("#unity-container");
  var canvas = document.querySelector("#unity-canvas");
  var loadingBar = document.querySelector("#unity-loading-bar");
  var progressBarFull = document.querySelector("#unity-progress-bar-full");
  var fullscreenButton = document.querySelector("#unity-fullscreen-button");
  var warningBanner = document.querySelector("#unity-warning");

  // Shows a temporary message banner/ribbon for a few seconds,
  // or a permanent error message if type == 'error'.
  function unityShowBanner(msg, type) {
    function updateBannerVisibility() {
      warningBanner.style.display =
        warningBanner.children.length ? "block" : "none";
    }

    var div = document.createElement("div");
    div.innerHTML = msg;
    warningBanner.appendChild(div);

    if (type == "error") {
      div.style = "background: red; padding: 10px;";
    } else {
      if (type == "warning") {
        div.style = "background: yellow; padding: 10px;";
      }

      setTimeout(function () {
        if (div.parentNode === warningBanner) {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }
      }, 5000);
    }

    updateBannerVisibility();
  }

  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/WebTest1.loader.js";

  var config = {
    dataUrl: buildUrl + "/WebTest1.data",
    frameworkUrl: buildUrl + "/WebTest1.framework.js",
    codeUrl: buildUrl + "/WebTest1.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "JoeDev Games",
    productName: "Co-Op Cafe Demo",
    productVersion: "Demo",
    showBanner: unityShowBanner
  };

  // ---------------------------------------------------------
  // MOBILE SETTINGS
  // ---------------------------------------------------------

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

    var meta = document.createElement("meta");
    meta.name = "viewport";
    meta.content =
      "width=device-width, height=device-height, initial-scale=1.0, " +
      "user-scalable=no, shrink-to-fit=yes";

    document.getElementsByTagName("head")[0].appendChild(meta);

    container.className = "unity-mobile";
    canvas.className = "unity-mobile";

    // Optional performance setting:
    // config.devicePixelRatio = 1;

    // Don't show Unity's "not supported" warning on mobile.
    // iOS can run Unity WebGL, although performance varies.
  } else {

    canvas.style.width = "960px";
    canvas.style.height = "600px";
  }

  // ---------------------------------------------------------
  // CREATE "TAP TO START" SCREEN
  // ---------------------------------------------------------

  var startScreen = document.createElement("div");

  startScreen.id = "ios-start-screen";

  startScreen.style.position = "fixed";
  startScreen.style.left = "0";
  startScreen.style.top = "0";
  startScreen.style.width = "100%";
  startScreen.style.height = "100%";
  startScreen.style.background = "#111";
  startScreen.style.display = "flex";
  startScreen.style.alignItems = "center";
  startScreen.style.justifyContent = "center";
  startScreen.style.zIndex = "99999";

  var startButton = document.createElement("button");

  startButton.innerText = "Tap to Start";

  startButton.style.padding = "20px 40px";
  startButton.style.fontSize = "24px";
  startButton.style.border = "none";
  startButton.style.borderRadius = "10px";
  startButton.style.cursor = "pointer";

  startScreen.appendChild(startButton);
  document.body.appendChild(startScreen);

  // ---------------------------------------------------------
  // UNITY LOADING
  // ---------------------------------------------------------

  loadingBar.style.display = "block";

  var unityStarted = false;

  startButton.addEventListener("click", function () {

    // Prevent double clicks
    if (unityStarted) {
      return;
    }

    unityStarted = true;

    // Hide the start screen immediately.
    // This click is the user's gesture that iOS/Safari requires.
    startScreen.style.display = "none";

    // Load Unity only after the user has interacted with the page.
    var script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = function () {

      createUnityInstance(
        canvas,
        config,
        function (progress) {
          progressBarFull.style.width =
            100 * progress + "%";
        }
      )
      .then(function (unityInstance) {

        loadingBar.style.display = "none";

        // Fullscreen button
        if (fullscreenButton) {
          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }

      })
      .catch(function (message) {
        alert(message);
      });
    };

    script.onerror = function () {
      alert("Could not load the Unity WebGL loader.");
    };

    document.body.appendChild(script);
  });
</script>
  </body>
</html>
